name: OMEGA Background Training

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/omega-background-training.mjs"
      - ".github/workflows/omega-background-training.yml"

permissions:
  contents: read

# Only one cloud training browser may run at a time.
concurrency:
  group: omega-background-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out the training controller
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the headless browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start or resume OMEGA training
        run: node scripts/omega-background-training.mjs

      - name: Upload browser recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-training-recovery-diagnostics
          path: omega-training-recovery/
          if-no-files-found: ignore
          retention-days: 7
